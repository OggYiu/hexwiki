name: Bug report
description: Report a reproducible HexWiki defect without sensitive material
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private source text, or generated evidence.
  - type: input
    id: version
    attributes:
      label: HexWiki version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
    validations:
      required: true
