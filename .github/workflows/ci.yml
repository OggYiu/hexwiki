name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python:
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Check out the complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check --editable ".[dev,model]"
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest -q
      - name: Exercise the installed CLI offline
        run: |
          hexwiki --help
          hexwiki preflight --skip-network --json

  package:
    name: Build and clean-install distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check ".[dev]"
      - name: Build wheel and source archive
        run: python -m build --wheel --sdist --outdir release-dist
      - name: Validate package metadata
        run: python -m twine check release-dist/*
      - name: Clean-install and inspect the wheel
        run: |
          python -m venv wheel-environment
          wheel-environment/bin/python -m pip install --disable-pip-version-check release-dist/*.whl
          wheel-environment/bin/hexwiki --version
          wheel-environment/bin/hexwiki preflight --skip-network --json
          wheel-environment/bin/python -c "from importlib import resources; assert resources.files('hexwiki.resources').joinpath('profile.schema.json').is_file()"
      - name: Clean-install and inspect the Git-free source archive
        run: |
          python -m venv sdist-environment
          sdist-environment/bin/python -m pip install --disable-pip-version-check release-dist/*.tar.gz
          sdist-environment/bin/hexwiki --version
          sdist-environment/bin/hexwiki preflight --skip-network --json
          sdist-environment/bin/python -c "from importlib import resources; assert resources.files('hexwiki.resources').joinpath('guide.md').is_file()"
      - name: Retain release candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hexwiki-distributions
          path: release-dist/
          if-no-files-found: error
          retention-days: 14

  remote-archive:
    name: Install the hosted commit archive
    needs: test
    runs-on: ubuntu-latest
    env:
      ARCHIVE_URL: ${{ github.api_url }}/repos/${{ github.repository }}/tarball/${{ github.sha }}
      ARCHIVE_TOKEN: ${{ github.token }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Download the exact commit archive
        shell: bash
        run: |
          python - <<'PY'
          import os
          import urllib.request

          request = urllib.request.Request(
              os.environ["ARCHIVE_URL"],
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["ARCHIVE_TOKEN"],
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              archive = response.read()
          if len(archive) < 1024:
              raise SystemExit("hosted source archive is unexpectedly small")
          with open("source-archive.tar.gz", "xb") as destination:
              destination.write(archive)
          PY
      - name: Install without a checkout or Git metadata
        run: |
          python -m venv archive-environment
          archive-environment/bin/python -m pip install --disable-pip-version-check source-archive.tar.gz
          archive-environment/bin/hexwiki --help
          archive-environment/bin/hexwiki preflight --skip-network --json
          archive-environment/bin/python -c "from importlib import resources; assert resources.files('hexwiki.resources').joinpath('profile.example.json').is_file()"
